name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to remove Terraform-managed resources in PROD, Staging, and DEV
        required: true
        type: string

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirmation != 'DESTROY' }}
        run: |
          echo "Type DESTROY in the confirmation field to continue."
          exit 1

  prod:
    needs: confirm
    runs-on: ubuntu-latest
    environment: PROD
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=prod.tfstate"
      - run: terraform destroy -auto-approve -var-file=envs/prod.tfvars

  staging:
    needs: prod
    runs-on: ubuntu-latest
    environment: Staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=staging.tfstate"
      - run: terraform destroy -auto-approve -var-file=envs/staging.tfvars

  dev:
    needs: staging
    runs-on: ubuntu-latest
    environment: DEV
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=dev.tfstate"
      - run: terraform destroy -auto-approve -var-file=envs/dev.tfvars