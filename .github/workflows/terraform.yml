name: terraform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: Dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=dev.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/dev.tfvars
      

  staging:
    needs: dev
    runs-on: ubuntu-latest
    environment: Staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=staging.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/staging.tfvars

  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment: PROD
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=prod.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/prod.tfvars